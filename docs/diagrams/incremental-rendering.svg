<svg width="680" height="400" viewBox="0 0 680 400" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Arial, sans-serif">
  <rect width="680" height="400" fill="#fafafa" rx="8"/>
  <text x="340" y="30" text-anchor="middle" font-size="16" font-weight="bold" fill="#212121">Incremental Damage Rendering</text>
  <text x="340" y="50" text-anchor="middle" font-size="11" fill="#546e7a">On each mouse move, only changed border strips are redrawn (O(W+H) instead of O(W*H))</text>
  <!-- BEFORE -->
  <text x="160" y="80" text-anchor="middle" font-size="13" font-weight="bold" fill="#c62828">Naive: full copy every frame</text>
  <rect x="30" y="95" width="260" height="160" fill="#e3f2fd" stroke="#90a4ae" stroke-width="1.5" rx="4"/>
  <defs>
    <pattern id="hatch" patternUnits="userSpaceOnUse" width="8" height="8">
      <path d="M-2,2 l4,-4 M0,8 l8,-8 M6,10 l4,-4" stroke="#ef5350" stroke-width="1"/>
    </pattern>
  </defs>
  <rect x="30" y="95" width="260" height="160" fill="url(#hatch)" opacity="0.4"/>
  <rect x="80" y="120" width="160" height="90" fill="none" stroke="#00bcd4" stroke-width="3"/>
  <text x="160" y="275" text-anchor="middle" font-size="10" fill="#c62828">Copy 1920x1080 = 8 MB per frame</text>
  <!-- Arrow -->
  <text x="340" y="183" text-anchor="middle" font-size="28" fill="#546e7a">-&gt;</text>
  <!-- AFTER -->
  <text x="520" y="80" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e7d32">Damage tracking: only dirty strips</text>
  <rect x="390" y="95" width="260" height="160" fill="#e3f2fd" stroke="#90a4ae" stroke-width="1.5" rx="4"/>
  <rect x="437" y="120" width="163" height="5" fill="#ff8f00" opacity="0.85"/>
  <rect x="437" y="202" width="163" height="5" fill="#ff8f00" opacity="0.85"/>
  <rect x="437" y="120" width="5" height="87" fill="#ff8f00" opacity="0.85"/>
  <rect x="595" y="120" width="5" height="87" fill="#ff8f00" opacity="0.85"/>
  <rect x="437" y="120" width="163" height="87" fill="none" stroke="#00bcd4" stroke-width="1.5" stroke-dasharray="4 2"/>
  <text x="519" y="114" text-anchor="middle" font-size="9" fill="#e65100">top strip (3px)</text>
  <text x="519" y="220" text-anchor="middle" font-size="9" fill="#e65100">bottom strip (3px)</text>
  <text x="520" y="275" text-anchor="middle" font-size="10" fill="#2e7d32">Copy ~12 KB per frame (x700 faster)</text>
  <!-- Explanation box -->
  <rect x="30" y="295" width="620" height="90" fill="#fff8e1" stroke="#f9a825" stroke-width="1.5" rx="6"/>
  <text x="340" y="315" text-anchor="middle" font-size="12" font-weight="bold" fill="#f57f17">OverlayDamage - tracks what was drawn in the previous frame</text>
  <text x="340" y="333" text-anchor="middle" font-size="10" fill="#795548">struct OverlayDamage { surface_size, start_pos, current_pos }</text>
  <text x="340" y="351" text-anchor="middle" font-size="10" fill="#795548">Each frame: restore pixels from OverlayDamage -&gt; draw new primitives -&gt; save new OverlayDamage</text>
  <text x="340" y="372" text-anchor="middle" font-size="10" fill="#795548">present_with_damage() passes only dirty rects to the OS compositor</text>
</svg>
