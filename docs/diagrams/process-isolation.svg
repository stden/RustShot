<svg width="860" height="340" viewBox="0 0 860 340" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Arial, sans-serif">
  <rect width="860" height="340" fill="#fafafa" rx="8"/>
  <!-- Tray Process box -->
  <rect x="20" y="20" width="340" height="300" fill="#e8f4fd" stroke="#1565c0" stroke-width="2" rx="10"/>
  <text x="190" y="46" text-anchor="middle" font-size="14" font-weight="bold" fill="#1565c0">Tray Process (long-lived)</text>
  <line x1="20" y1="54" x2="360" y2="54" stroke="#1565c0" stroke-width="1.5" stroke-dasharray="4 2"/>
  <rect x="40" y="66" width="140" height="36" fill="#1565c0" rx="6"/>
  <text x="110" y="88" text-anchor="middle" font-size="12" fill="white">main.rs</text>
  <text x="110" y="100" text-anchor="middle" font-size="10" fill="#b3d9ff">(event loop)</text>
  <rect x="195" y="66" width="140" height="36" fill="#1565c0" rx="6"/>
  <text x="265" y="88" text-anchor="middle" font-size="12" fill="white">tray.rs</text>
  <text x="265" y="100" text-anchor="middle" font-size="10" fill="#b3d9ff">(icon + menu)</text>
  <rect x="40" y="118" width="140" height="36" fill="#1976d2" rx="6"/>
  <text x="110" y="140" text-anchor="middle" font-size="12" fill="white">capture.rs</text>
  <text x="110" y="152" text-anchor="middle" font-size="10" fill="#b3d9ff">(save image)</text>
  <rect x="195" y="118" width="140" height="36" fill="#1976d2" rx="6"/>
  <text x="265" y="140" text-anchor="middle" font-size="12" fill="white">record.rs</text>
  <text x="265" y="152" text-anchor="middle" font-size="10" fill="#b3d9ff">(H.264 thread)</text>
  <rect x="40" y="170" width="140" height="36" fill="#1976d2" rx="6"/>
  <text x="110" y="192" text-anchor="middle" font-size="12" fill="white">settings.rs</text>
  <text x="110" y="204" text-anchor="middle" font-size="10" fill="#b3d9ff">(config JSON)</text>
  <rect x="195" y="170" width="140" height="36" fill="#1976d2" rx="6"/>
  <text x="265" y="192" text-anchor="middle" font-size="12" fill="white">child_process.rs</text>
  <text x="265" y="204" text-anchor="middle" font-size="10" fill="#b3d9ff">(lifecycle)</text>
  <rect x="40" y="222" width="295" height="36" fill="#0d47a1" rx="6"/>
  <text x="187" y="244" text-anchor="middle" font-size="12" fill="white">selection_clipboard.rs</text>
  <text x="187" y="256" text-anchor="middle" font-size="10" fill="#b3d9ff">(reads RgbaImage from stdout pipe)</text>
  <rect x="40" y="268" width="140" height="36" fill="#0d47a1" rx="6"/>
  <text x="110" y="290" text-anchor="middle" font-size="12" fill="white">arboard</text>
  <text x="110" y="302" text-anchor="middle" font-size="10" fill="#b3d9ff">(clipboard)</text>
  <rect x="195" y="268" width="140" height="36" fill="#0d47a1" rx="6"/>
  <text x="265" y="290" text-anchor="middle" font-size="12" fill="white">cli.rs</text>
  <text x="265" y="302" text-anchor="middle" font-size="10" fill="#b3d9ff">(pure helpers)</text>
  <!-- Child Process box -->
  <rect x="500" y="20" width="340" height="220" fill="#e8f5e9" stroke="#2e7d32" stroke-width="2" rx="10"/>
  <text x="670" y="46" text-anchor="middle" font-size="14" font-weight="bold" fill="#2e7d32">Child Process (short-lived)</text>
  <line x1="500" y1="54" x2="840" y2="54" stroke="#2e7d32" stroke-width="1.5" stroke-dasharray="4 2"/>
  <rect x="520" y="66" width="140" height="36" fill="#2e7d32" rx="6"/>
  <text x="590" y="88" text-anchor="middle" font-size="12" fill="white">selection.rs</text>
  <text x="590" y="100" text-anchor="middle" font-size="10" fill="#c8e6c9">(overlay window)</text>
  <rect x="675" y="66" width="140" height="36" fill="#2e7d32" rx="6"/>
  <text x="745" y="88" text-anchor="middle" font-size="12" fill="white">winit + softbuffer</text>
  <text x="745" y="100" text-anchor="middle" font-size="10" fill="#c8e6c9">(fullscreen render)</text>
  <rect x="520" y="118" width="295" height="36" fill="#388e3c" rx="6"/>
  <text x="667" y="140" text-anchor="middle" font-size="12" fill="white">capture.rs (screen capture)</text>
  <text x="667" y="152" text-anchor="middle" font-size="10" fill="#c8e6c9">(screenshots crate - BGRA pixels)</text>
  <rect x="520" y="170" width="295" height="36" fill="#1b5e20" rx="6"/>
  <text x="667" y="192" text-anchor="middle" font-size="12" fill="white">selection_clipboard.rs</text>
  <text x="667" y="204" text-anchor="middle" font-size="10" fill="#c8e6c9">(writes RgbaImage to stdout pipe)</text>
  <!-- IPC Arrows -->
  <defs>
    <marker id="arr1" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#e65100"/>
    </marker>
    <marker id="arr2" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#6a1b9a"/>
    </marker>
  </defs>
  <line x1="360" y1="170" x2="500" y2="170" stroke="#e65100" stroke-width="2.5" marker-end="url(#arr1)"/>
  <text x="430" y="158" text-anchor="middle" font-size="11" fill="#e65100" font-weight="bold">spawn</text>
  <text x="430" y="172" text-anchor="middle" font-size="9" fill="#e65100">--select</text>
  <line x1="500" y1="200" x2="360" y2="200" stroke="#6a1b9a" stroke-width="2.5" marker-end="url(#arr2)" stroke-dasharray="6 3"/>
  <text x="430" y="215" text-anchor="middle" font-size="11" fill="#6a1b9a" font-weight="bold">stdout pipe</text>
  <text x="430" y="228" text-anchor="middle" font-size="9" fill="#6a1b9a">[w][h][RGBA pixels]</text>
  <!-- Trigger -->
  <rect x="500" y="258" width="340" height="62" fill="#fff3e0" stroke="#e65100" stroke-width="1.5" rx="8"/>
  <text x="670" y="276" text-anchor="middle" font-size="12" fill="#e65100" font-weight="bold">Trigger</text>
  <text x="670" y="293" text-anchor="middle" font-size="11" fill="#bf360c">PrintScreen -&gt; screenshot</text>
  <text x="670" y="308" text-anchor="middle" font-size="11" fill="#bf360c">Ctrl+Shift+R -&gt; recording region</text>
</svg>
