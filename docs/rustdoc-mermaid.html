<!-- Optional rustdoc header; diagram definitions remain in the Rust comments.
     cargo rustdoc --lib --all-features -- --html-in-header docs/rustdoc-mermaid.html
     Browser-only dependency, pinned to the upstream mermaid@11.17.2 release.
     API: https://mermaid.js.org/config/usage.html#api-usage -->
<style>
  .rustshot-mermaid-diagram {
    background: #fff;
    color: #24292f;
    border-radius: 4px;
    margin: 1em 0;
    padding: 1em;
    overflow-x: auto;
  }

  .rustshot-mermaid-diagram svg {
    display: block;
    margin: auto;
    max-width: 100%;
    height: auto;
  }

  .rustshot-mermaid-source > summary {
    cursor: pointer;
    margin: 0.5em 0;
  }

  .rustshot-mermaid-notice {
    font-size: 0.9em;
  }
</style>
<script type="module">
  const blocks = [...new Set(
    [...document.querySelectorAll("pre.language-mermaid, code.language-mermaid")]
      .map((node) => node.closest("pre"))
      .filter(Boolean),
  )];

  function showNotice(block, message) {
    const notice = document.createElement("p");
    notice.className = "rustshot-mermaid-notice";
    notice.textContent = message;
    const source = block.closest(".example-wrap") || block;
    source.before(notice);
  }

  async function renderDiagrams() {
    if (blocks.length === 0) return;

    let mermaid;
    try {
      ({ default: mermaid } = await import(
        "https://cdn.jsdelivr.net/npm/mermaid@11.17.2/dist/mermaid.esm.min.mjs"
      ));
      mermaid.initialize({
        startOnLoad: false,
        securityLevel: "strict",
        theme: "neutral",
        logLevel: "fatal",
        suppressErrorRendering: true,
      });
      await document.fonts.ready;
    } catch {
      for (const block of blocks) {
        showNotice(block, "Diagram renderer unavailable. The Mermaid source is shown below.");
      }
      return;
    }

    for (const [index, block] of blocks.entries()) {
      try {
        const definition = (block.querySelector("code") || block).textContent;
        const { svg, bindFunctions } = await mermaid.render(
          `rustshot-mermaid-${index}`,
          definition,
        );
        const diagram = document.createElement("div");
        diagram.className = "rustshot-mermaid-diagram";
        diagram.innerHTML = svg;
        const source = block.closest(".example-wrap") || block;
        source.before(diagram);
        bindFunctions?.(diagram);

        // Move the original rustdoc node only after successful rendering, keeping
        // its exact text and copy controls available without maintaining a copy.
        const details = document.createElement("details");
        details.className = "rustshot-mermaid-source";
        const summary = document.createElement("summary");
        summary.textContent = "Mermaid source";
        details.append(summary);
        source.before(details);
        details.append(source);
      } catch {
        showNotice(block, "This diagram could not be rendered. The Mermaid source is shown below.");
      }
    }
  }

  await renderDiagrams();
</script>
