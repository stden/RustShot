min_version = "2026.10.12"

[settings]
idiomatic_version_file_enable_tools = ["rust"]

[tools]
rtk = "0.49.0"
python = "3.13"
rust = "1.99.1"

[tasks.build]
description = "Build the release binary"
run = "rtk cargo build --release"

[tasks.check]
description = "Check all Cargo targets"
run = "rtk cargo check --all-targets"

[tasks.test]
description = "Run the application and duplication detector tests"
run = [
  "rtk cargo test",
  "rtk cargo test --manifest-path tools/check_duplicates/Cargo.toml",
]

[tasks.lint]
description = "Check all targets and the duplication detector with Clippy"
run = [
  "rtk cargo clippy --all-targets -- -D warnings",
  "rtk cargo clippy --manifest-path tools/check_duplicates/Cargo.toml --all-targets -- -D warnings",
]

[tasks.fmt]
description = "Format the application and duplication detector"
run = [
  "rtk cargo fmt --all",
  "rtk cargo fmt --manifest-path tools/check_duplicates/Cargo.toml --all",
]

[tasks."fmt:check"]
description = "Check Rust source formatting"
run = [
  "rtk cargo fmt --all --check",
  "rtk cargo fmt --manifest-path tools/check_duplicates/Cargo.toml --all --check",
]

[tasks.bench]
description = "Run the Cargo benchmarks"
run = "rtk cargo bench"

[tasks.duplication]
description = "Check the application source for duplicate code"
run = "rtk cargo run --manifest-path tools/check_duplicates/Cargo.toml -- src"

[tasks.ci]
description = "Run the local format, Clippy, duplication and test checks"
run = [
  { task = "fmt:check" },
  { task = "lint" },
  { task = "duplication" },
  { task = "test" },
]

[tasks."rust:check"]
run = "cargo check"

[tasks."tools:check_duplicates:check"]
run = "cargo check"
dir = "tools/check_duplicates"

[tasks."tools:check_duplicates:test"]
run = "cargo test"
dir = "tools/check_duplicates"

[tasks."tools:check_duplicates:build"]
run = "cargo build"
dir = "tools/check_duplicates"
