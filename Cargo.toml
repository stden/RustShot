[package]
name = "rustshot"
version = "0.1.0"
edition = "2021"
authors = ["RustShot Contributors"]
description = "A screenshot and screen recording utility written in Rust"
license = "MIT OR Apache-2.0"

[lib]
bench = false

[[bin]]
name = "RustShot"
path = "src/main.rs"
bench = false

[dependencies]
screenshots = "0.8"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "bmp"] }
chrono = "0.4"
clap = { version = "4", features = ["derive"] }
tray-icon = "0.24"
global-hotkey = "0.8"
winit = { version = "0.30", features = ["rwh_06"] }
dirs = "6"
arboard = "3"
softbuffer = "0.4"
log = "0.4"
simplelog = "0.12"
# Used only by the MCP server (src/mcp.rs) to parse arbitrary JSON-RPC from
# clients. Settings deliberately stay serde-free (see src/settings.rs) — that
# schema is tiny and fixed; MCP request payloads are neither.
serde_json = "1"

[dev-dependencies]
criterion = { version = "0.8", features = ["html_reports"] }
proptest = "1"
cucumber = "0.23"
futures = "0.3"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
    "Foundation",
    "Graphics_Capture",
    "Graphics_DirectX_Direct3D11",
    "Win32_Foundation",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Graphics_Gdi",
    "Win32_Media_MediaFoundation",
    "Win32_Storage_Xps",
    "Win32_System_Com",
    "Win32_System_Registry",
    "Win32_System_WinRT_Direct3D11",
    "Win32_System_WinRT_Graphics_Capture",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[[bench]]
name = "benchmarks"
harness = false

[[bench]]
name = "performance_gate"
harness = false

# Executable BDD specifications: Gherkin features under tests/features/ drive
# the public API. harness = false because the binary supplies its own main()
# that runs the Cucumber runner.
[[test]]
name = "bdd"
harness = false

[profile.dev]
debug = 1
strip = "debuginfo"
split-debuginfo = "unpacked"

[profile.test]
debug = 0
incremental = false
strip = "debuginfo"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true
split-debuginfo = "unpacked"
