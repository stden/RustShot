[package]
name = "check_duplicates"
version = "0.1.0"
edition = "2021"
description = "Code duplication detector for Rust source files"

[[bin]]
name = "check_duplicates"
path = "src/main.rs"

[dependencies]
proc-macro2 = { version = "1", features = ["span-locations"] }
quote = "1"
syn = { version = "2", features = ["full", "visit"] }
